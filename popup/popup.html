<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JWT Decoder</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <header>
      <h1>JWT Decoder</h1>
      <button id="clear-btn" class="btn-clear">Clear All</button>
    </header>

    <div class="toolbar">
      <input type="text" id="search-input" placeholder="Search domain or payload..." autocomplete="off">
    </div>

    <div id="jwt-list" class="jwt-list">
      <!-- JWT items will be injected here -->
      <div class="empty-state">No JWTs captured yet.<br><small>Browse sites normally. Tokens sent in headers will appear here.</small></div>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
